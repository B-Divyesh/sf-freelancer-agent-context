[package]
name = "client-context-firewall"
version = "0.1.0"
description = "A local client boundary for freelance developers"
authors = ["Param Factory"]
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-freelancer-agent-context"
edition = "2021"

[lib]
name = "client_context_firewall_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
tauri = { version = "2.8", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10"
base64 = "0.22"
keyring = { version = "3.6", features = ["apple-native", "windows-native", "sync-secret-service"] }
rand = "0.8"

